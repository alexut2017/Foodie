<script>
'use strict';
// LocalScout phone app (installable web app). Same Supabase project, data and rules as the website.
// Only the project URL and publishable key belong here. Secrets stay in Supabase.
var CFG = {
  url: 'https://mroiimqqklitidpzaqnk.supabase.co',
  key: 'sb_publishable_1YSf5nmBBotBnOULa3g7vQ_nj0Fd1RH',
  site: '../',
  termsVersion: '2026-11-04',

  sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });

var PASS_MS = CFG.passMinutes * 60000;
var KEY = 'gs-app';
var DAY = 86400000;

// UI state that survives a reload (no account data).
function fresh() { return { tab: 'explore', q: '', show: 'all', cuisine: null, sort: 'new', district: null, passQ: '', visit: null, mode: 'join', method: 'phone', phone: '', email: '', name: '' }; }
var S = (function () { try { var v = JSON.parse(localStorage.getItem(KEY)); return Object.assign(fresh(), v && typeof v === 'object' ? v : {}); } catch (e) { return fresh(); } })();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private mode */ } }

// Runtime state.
var R = { screen: 'loading', detail: null, sentAt: 0, code: '', agree: false, marketing: false, filtersOpen: false, here: null, locMsg: null, map: null, markers: null, busy: false, msg: null, user: null, member: null, status: { active: false }, isAdmin: false, payOpen: false,
  districts: [], list: [], dirState: 'loading', partner: null, partnerOpen: false };

function set(patch, keepFocus) { Object.keys(patch).forEach(function (k) { if (k in S) S[k] = patch[k]; else R[k] = patch[k]; }); save(); render(keepFocus); }

var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

var safeUrl = function (u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; };

var LOGO = '<svg width="SIZE" height="SIZE" viewBox="240 148 840 840" role="img" aria-label="LocalScout"><path d="M552 795 A239 98 0 1 0 770 795 L751 821 A177 58 0 1 1 570 821 Z" fill="#E34C19"/><path d="M660 157 C515 157 398 275 398 420 C398 470 410 515 430 555 C480 660 590 800 653 881 Q660 888 667 881 C730 800 840 660 890 547 C910 505 920 470 920 420 C920 275 805 157 660 157 Z" fill="#E34C19"/><path d="M567 283 A21 21 0 0 1 609 283 V407 A16 16 0 0 0 641 407 V283 A21.5 21.5 0 0 1 684 283 V407 A16 16 0 0 0 716 407 V283 A21 21 0 0 1 758 283 L764 435 C764 478 735 506 702 507 C697 507 694 510 694 516 V550 L698 670 C698 692 682 708 662 708 C642 708 626 692 626 670 L630 550 V516 C630 510 627 507 622 507 C589 506 561 478 561 435 Z" fill="#FFFFFF"/></svg>';

var ICON = {
  fork: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/></svg>',

};
var msgHtml = function () { return R.msg ? '<p class="note ' + (R.msg.kind || '') + '" role="' + (R.msg.kind === 'err' ? 'alert' : 'status') + '">' + esc(R.msg.text) + '</p>' : ''; };

// ---------- Data (same queries as the website) ----------
function restaurantFromRow(r) {
  var now = Date.now();
  return {
    id: String(r.id), name: r.name || 'Restaurant', desc: r.description || '', cuisine: r.cuisine || '', district: r.district_id || '',
    place: [r.city, r.state].filter(Boolean).join(', '), lat: r.lat == null ? null : Number(r.lat), lng: r.lng == null ? null : Number(r.lng),
    address: r.address || '', hours: r.hours || '', phone: r.phone || '', website: safeUrl(r.website_url),
    price: Math.max(1, Math.min(4, Number(r.price_level) || 2)), dineIn: r.dine_in !== false, pickup: !!r.pickup,
    offer: r.offer_text || 'Member offer coming soon', featured: !!r.featured, photo: safeUrl(r.photo_url),
    isNew: !!r.listed_at && now - new Date(r.listed_at).getTime() < 30 * DAY,
    founding: !!r.founding_until && new Date(r.founding_until).getTime() > now

}
function districtName(id) { for (var i = 0; i < R.districts.length; i++) if (R.districts[i].id === id) return R.districts[i].name; return ''; }
function find(id) { for (var i = 0; i < R.list.length; i++) if (R.list[i].id === id) return R.list[i]; return null; }

async function loadDirectory() {
  if (!sb) { R.dirState = 'error'; return render(); }
  try {
    var d = await sb.from('districts').select('id, name, lat, lng, live').order('sort_order');
    var r = await sb.from('restaurants').select('id, name, description, cuisine, district_id, city, state, address, hours, phone, website_url, lat, lng, price_level, dine_in, pickup, offer_text, founding_until, listed_at, featured, photo_url').eq('status', 'active').order('name');

    R.districts = d.data || [];
    R.list = (r.data || []).map(restaurantFromRow).sort(function (a, b) { return (b.featured - a.featured) || a.name.localeCompare(b.name); });

}
async function loadPayOpen() {
  if (!sb) return;
  try { var o = await sb.from('offerings').select('id, active').eq('id', 'membership_annual').maybeSingle(); R.payOpen = !!(o.data && o.data.active); } catch (e) { R.payOpen = false; }
}
function memberFromUser(u) {

  var ph = String(u.phone || m.phone || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
  return { id: u.id, name: name, email: u.email || '', phone: ph ? fmtPhone(ph) : '', ref: 'GS-' + String(u.id).replace(/-/g, '').slice(0, 6).toUpperCase(), since: u.created_at };
}
async function statusFromEntitlements(uid) {
  try {
    var q = await sb.from('entitlements').select('source, access_expires_at, grace_expires_at').eq('user_id', uid).eq('feature', 'membership');
    if (q.error) throw q.error;
    var now = Date.now(), best = null;
    (q.data || []).forEach(function (e) {

async function checkAdmin(uid) {

  var st = await statusFromEntitlements(session.user.id);

  R.status = st; R.isAdmin = adm;
  if (!st.active && S.visit) S.visit = null;
  save(); render();
  loadReferrals(true);

  if (!sb || !R.user) return;
  var pending = storedRef();
  if (claimPending && pending) {
    try {
      var c = await sb.rpc('claim_referral', { p_code: pending });
      if (!c.error) { try { localStorage.removeItem('gs-ref'); } catch (e) { /* storage off */ } }

  }
  try { var r = await sb.rpc('my_referrals'); if (!r.error && r.data) { R.refs = r.data; render(); } } catch (e) { /* stats are optional */ }
}
async function applyRef() {
  var el = document.getElementById('refIn'), code = el ? el.value.trim().toUpperCase() : '';
  if (!refOk(code)) return set({ refMsg: { kind: 'err', text: 'Referral codes look like GS-1A2B3C.' } });
  var res; try { res = await sb.rpc('claim_referral', { p_code: code }); } catch (e) { res = { error: { message: 'network' } }; }
  var out = res.error ? 'error' : res.data;
  var text = { ok: 'Thanks! Your friend gets a free month once your membership starts.', invalid_code: 'We couldn’t find that code. Check it with your friend.', own_code: 'That’s your own code. Share it with friends instead.', already_referred: 'Your account already has a referral.', too_late: 'Referral codes can be added within 14 days of joining.' }[out] || 'We couldn’t save the code. Check your connection and try again.';
  set({ refMsg: { kind: out === 'ok' ? 'ok' : 'err', text: text } });
  if (out === 'ok') loadReferrals(false);
}

// ---------- Auth: same as the website. Join collects name, email, phone and address, then a 6-digit email code. ----------
var fmtPhone = function (d) { d = String(d || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, ''); return d.length === 10 ? d.slice(0, 3) + '-' + d.slice(3, 6) + '-' + d.slice(6) : d; };
var US_STATES = ['AL','AK','AZ','AR','CA','CO','CT','DE','DC','FL','GA','HI','ID','IL','IN','IA','KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ','NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT','VA','WA','WV','WI','WY'];
var refOk = function (c) { return /^GS-[0-9A-F]{6}$/i.test(String(c || '').trim()); };
var storedRef = function () { try { return localStorage.getItem('gs-ref') || ''; } catch (e) { return ''; } };
function authErrText(err) { return (String(err.message || '') + ' ' + String(err.code || '') + ' ' + String(err.status || '')).toLowerCase(); }
// Reads the join form into R.d. Returns the first problem, or '' when everything is filled in (same checks as the website).
function readJoin() {
  var v = function (id) { var el = document.getElementById(id); return el ? el.value.trim() : ''; };
  var d = { first_name: v('jdFirst'), last_name: v('jdLast'), phone: v('jdPhone'), address_line1: v('jdAddress1'), address_line2: v('jdAddress2'), city: v('jdCity'), state: v('jdState'), zip: v('jdZip'), ref: v('jdRef').toUpperCase() };
  var m = document.getElementById('mktIn'); R.marketing = !!(m && m.checked);
  R.d = d; S.email = v('emailIn'); save();
  if (!d.first_name || !d.last_name) return 'Enter your first and last name.';
  if (!emailOk(S.email)) return 'Enter a valid email address, like name@example.com.';
  var digits = d.phone.replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
  if (!digits) return 'Enter your phone number.';
  if (digits.length !== 10) return 'Enter a 10-digit phone number, like 555-555-5555.';
  d.phone = fmtPhone(digits);
  if (!d.address_line1 || !d.city || !d.state) return 'Enter your full address.';
  if (!/^\d{5}(-\d{4})?$/.test(d.zip)) return 'Enter a 5-digit zip code.';
  if (d.ref && !refOk(d.ref)) return 'Referral codes look like GS-1A2B3C. Check it, or leave it blank.';
  return '';
}
async function sendCode(isResend) {
  if (!sb) return set({ msg: { kind: 'err', text: 'LocalScout could not load. Check your connection and reload.' } });
  var join = S.mode === 'join';
  if (!isResend) {
    var problem = join ? readJoin() : (function () { var el = document.getElementById('emailIn'); S.email = el ? el.value.trim() : S.email; save(); return emailOk(S.email) ? '' : 'Enter a valid email address, like name@example.com.'; })();
    if (problem) return set({ msg: { kind: 'err', text: problem } });
  }
  var d = R.d || {};
  var opts = { shouldCreateUser: join, emailRedirectTo: location.origin + location.pathname };
  if (join) opts.data = {
    full_name: (d.first_name + ' ' + d.last_name).trim(), first_name: d.first_name, last_name: d.last_name, phone: d.phone,
    address_line1: d.address_line1, address_line2: d.address_line2 || undefined, city: d.city, state: d.state, zip: d.zip,
    terms_version: CFG.termsVersion, terms_accepted_at: new Date().toISOString(), marketing_opt_in: !!R.marketing,
    referred_by: d.ref || undefined
  };
  set({ busy: true, msg: null });
  var res; try { res = await sb.auth.signInWithOtp({ email: S.email.trim().toLowerCase(), options: opts }); } catch (e) { res = { error: { message: 'network' } }; }
  var err = res && res.error, t = err ? authErrText(err) : '';
  if (err && !join && /otp_disabled|signups? not allowed|user not found/.test(t)) err = null; // don't reveal whether an account exists
  if (err) return set({ busy: false, msg: { kind: 'err', text: /rate|too many|429|seconds/.test(t) ? 'Too many code requests. Wait a minute, then try again.' : 'We couldn’t send the code just now. Check the address and try again in a minute.' } });
  set({ busy: false, screen: 'code', code: '', sentAt: Date.now(), msg: isResend ? { kind: 'ok', text: 'New code sent. Check your inbox and spam folder.' } : null }, 'codeIn');
}
async function verifyCode() {
  if (R.busy || R.code.length < 6) return;
  set({ busy: true, msg: null });
  var res; try { res = await sb.auth.verifyOtp({ email: S.email.trim().toLowerCase(), token: R.code, type: 'email' }); } catch (e) { res = { error: { message: 'network' } }; }
  if (res.error || !res.data || !res.data.session) {
    var t = res.error ? authErrText(res.error) : '';
    var m = /rate|too many|429/.test(t) ? 'Too many attempts. Wait a minute, then try again.' : 'That code is wrong or has expired. Check the latest email, or send a new code.';
    return set({ busy: false, code: '', msg: { kind: 'err', text: m } }, 'codeIn');
  }
  R.busy = false; R.code = '';
  await onSession(res.data.session);
}
async function signOut(all) {
  set({ busy: true });
  try { await sb.auth.signOut({ scope: all ? 'global' : 'local' }); } catch (e) { /* still clear locally */ }
  S.visit = null; save();
  set({ busy: false, screen: 'welcome', refs: null, refMsg: null, user: null, member: null, status: { active: false }, isAdmin: false, msg: { kind: 'ok', text: all ? 'Signed out on all devices.' : 'Signed out.' } });
}

// Status badges, same as the website: New, Founding partner, plus Popular for featured partners.
function badgesHtml(r) {
  var b = [];
  if (r.isNew) b.push('<span class="badge new">★ New</span>');
  if (r.founding) b.push('<span class="badge founding">★ Founding partner</span>');
  if (r.featured) b.push('<span class="badge popular">♥ Popular</span>');
  return b.length ? '<span class="badges">' + b.join('') + '</span>' : '';
}
var placeOf = function (r) { return r.place || districtName(r.district); };
var match = function (r, q) { return !q || [r.name, r.cuisine, placeOf(r), r.desc, r.offer].join(' ').toLowerCase().indexOf(q.toLowerCase()) >= 0; };
function miles(a, r) {
  if (r.lat == null || r.lng == null) return Infinity;
  var rad = function (d) { return d * Math.PI / 180; }, dLat = rad(r.lat - a.lat), dLng = rad(r.lng - a.lng);
  var h = Math.pow(Math.sin(dLat / 2), 2) + Math.cos(rad(a.lat)) * Math.cos(rad(r.lat)) * Math.pow(Math.sin(dLng / 2), 2);
  return 3958.8 * 2 * Math.asin(Math.sqrt(h));
}
function cardHtml(r) {
  var dist = S.sort === 'near' && R.here && miles(R.here, r) < Infinity ? miles(R.here, r).toFixed(1) + ' mi' : '';
  return '<button class="rcard" data-act="detail" data-id="' + esc(r.id) + '">' +
    (r.photo ? '<img class="rphoto" src="' + esc(r.photo) + '" alt="" loading="lazy">' : '') +
    '<span class="rtop"><span class="name">' + esc(r.name) + '</span>' + badgesHtml(r) + '</span>' +
    '<span class="meta">' + esc([r.cuisine, placeOf(r), dist].filter(Boolean).join('  ·  ')) + '</span>' +
    (r.desc ? '<span class="rdesc">' + esc(r.desc) + '</span>' : '') +
    '<span class="roffer">' + esc(r.offer) + '</span>' +
    '<span class="badges">' + (r.dineIn ? '<span class="svc">Dine-in</span>' : '') + (r.pickup ? '<span class="svc">Pickup</span>' : '') + '</span>' +
    '<span class="rview">View restaurant</span></button>';
}
function exploreItems() {
  var list = R.list.filter(function (r) {
    return (S.show === 'all' || (S.show === 'new' ? r.isNew : r.featured)) && (!S.cuisine || r.cuisine === S.cuisine) && match(r, S.q);
  });
  if (S.sort === 'near' && R.here) return list.sort(function (a, b) { return miles(R.here, a) - miles(R.here, b); });
  if (S.sort === 'az') return list.sort(function (a, b) { return a.name.localeCompare(b.name); });
  return list.sort(function (a, b) { return (b.isNew - a.isNew) || (b.featured - a.featured) || a.name.localeCompare(b.name); });
}
var filtered = function () { return S.show !== 'all' || !!S.cuisine || !!S.q.trim() || S.sort !== 'new'; };

// Leaflet map (same map tiles as the website). Rebuilt after each render of Explore; markers follow the filters.
function drawMap() {
  if (R.map) { try { R.map.remove(); } catch (e) { /* already gone */ } R.map = null; }
  var el = document.getElementById('map');
  if (!el || !window.L) return;
  R.map = L.map(el, { zoomControl: true, attributionControl: true }).setView([29.745, -95.43], 11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(R.map);
  R.markers = L.layerGroup().addTo(R.map);
  updateMarkers();
}
function updateMarkers() {
  if (!R.map) return;
  R.markers.clearLayers();
  var pts = [];
  (R.dirState === 'ready' ? exploreItems() : []).forEach(function (r) {
    if (r.lat == null || r.lng == null) return;
    pts.push([r.lat, r.lng]);
    L.circleMarker([r.lat, r.lng], { radius: 10, color: '#FFFDF8', weight: 3, fillColor: '#172A2A', fillOpacity: 1 })
      .bindPopup('<b>' + esc(r.name) + '</b><br>' + esc(r.offer) + '<br><a href="#" data-act="detail" data-id="' + esc(r.id) + '">View restaurant</a>')
      .addTo(R.markers);
  });
  if (R.here) { pts.push([R.here.lat, R.here.lng]); L.circleMarker([R.here.lat, R.here.lng], { radius: 7, color: '#FFFDF8', weight: 3, fillColor: '#E2552B', fillOpacity: 1 }).bindPopup('You are here').addTo(R.markers); }
  if (pts.length === 1) R.map.setView(pts[0], 14);
  else if (pts.length > 1) R.map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
}
function refreshResults() {

  var c = document.getElementById('countLine'); if (c) c.innerHTML = countHtml();
  updateMarkers();
}
function locate() {
  if (!navigator.geolocation) return set({ locMsg: 'This browser can’t share your location.' });
  navigator.geolocation.getCurrentPosition(function (p) {
    S.sort = 'near'; save();
    set({ here: { lat: p.coords.latitude, lng: p.coords.longitude }, locMsg: null });
  }, function () { set({ locMsg: 'Location is off for this site. Allow it in your browser settings to sort by distance.' }); }, { timeout: 10000, maximumAge: 300000 });
}

// ---------- Visits ----------
function openPass(id) {
  if (!R.member || !R.status.active) return set({ tab: 'pass', detail: null });
  var r = find(id);
  set({ tab: 'pass', detail: null, visit: { rid: id, name: r ? r.name : '', offer: r ? r.offer : '', openedAt: Date.now(), confirmedAt: null, code: null } });
}
async function confirmVisit() {
  if (!S.visit || S.visit.confirmedAt) return;
  var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', c = '', b = crypto.getRandomValues(new Uint8Array(6));
  for (var i = 0; i < 6; i++) c += a[b[i] % a.length];
  if (navigator.vibrate) navigator.vibrate(60);
  var v = Object.assign({}, S.visit, { confirmedAt: Date.now(), code: c });
  set({ visit: v });
  try {
    var res = await sb.from('redemptions').insert({ restaurant_id: v.rid, restaurant_name: v.name || null, offer: v.offer || null, code: v.code, opened_at: new Date(v.openedAt).toISOString(), confirmed_at: new Date(v.confirmedAt).toISOString() });
    if (res.error) console.warn('LocalScout: visit not recorded', res.error.message);
  } catch (e) { console.warn('LocalScout: visit not recorded'); }
}

// ---------- Partner application (same RPC as the website) ----------
async function submitPartner() {
  var p = R.partner = R.partner || {};
  document.querySelectorAll('.pf').forEach(function (el) { p[el.id] = el.value; });
  var t = function (k) { return String(p[k] || '').trim(); };
  var req = ['pName', 'pFirst', 'pLast', 'pPhone', 'pEmail', 'pAddress1', 'pCity', 'pState', 'pZip', 'pCuisine', 'pDesc'];
  var missing = req.filter(function (k) { return !t(k); });
  if (missing.length) { p.err = 'Please fill in every field marked *.'; render(); var el = document.getElementById(missing[0]); if (el) el.focus(); return; }
  if (!emailOk(t('pEmail'))) { p.err = 'Check the email address.'; render(); document.getElementById('pEmail').focus(); return; }
  if (t('pPhone').replace(/\D/g, '').length < 10) { p.err = 'Check the phone number.'; render(); document.getElementById('pPhone').focus(); return; }
  p.err = null; p.busy = true; render();
  var address = [t('pAddress1'), t('pAddress2'), t('pCity') + ', ' + t('pState').toUpperCase() + ' ' + t('pZip')].filter(Boolean).join(', ');
  var res;
  try {
    res = await sb.rpc('submit_partner_application', {
      p_restaurant_name: t('pName'), p_contact_name: t('pFirst') + ' ' + t('pLast'), p_contact_reach: 'Phone: ' + t('pPhone') + ' | Email: ' + t('pEmail'),
      p_description: t('pDesc'), p_address: address, p_district: t('pCity'), p_cuisine: t('pCuisine'), p_proposed_offer: t('pOffer') || null, p_hp: t('pHp')
    });
  } catch (e) { res = { error: { message: 'network' } }; }
  p.busy = false;
  if (res.error) { p.err = /rate_limited/i.test(String(res.error.message || '')) ? 'We’ve received several applications from you recently. Please try again later.' : 'We couldn’t send your application. Check your connection and try again.'; return render(); }
  R.partner = { done: true }; render();
}

// ---------- Events ----------
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (t.tagName === 'A' && t.getAttribute('href') === '#') e.preventDefault();
  var id = t.getAttribute('data-id');
  switch (t.getAttribute('data-act')) {
    case 'join': return set({ screen: 'login', mode: 'join', detail: null, msg: null }, (R.d && R.d.first_name) ? 'emailIn' : 'jdFirst');
    case 'signin': return set({ screen: 'login', mode: 'signin', detail: null, msg: null }, 'emailIn');
    case 'browse': return set({ screen: 'app', tab: 'explore', msg: null });
    case 'toWelcome': return set({ screen: R.user ? 'app' : 'welcome', msg: null });
    case 'toLogin': return set({ screen: 'login', code: '', msg: null }, 'emailIn');
    case 'send': return sendCode(false);
    case 'resend': return sendCode(true);
    case 'verify': return verifyCode();
    case 'show': return S.show = id, save(), render();
    case 'cuisine': return S.cuisine = id || null, save(), render();
    case 'sort': if (id === 'near' && !R.here) return locate(); S.sort = id; save(); return render();
    case 'filters': return set({ filtersOpen: !R.filtersOpen });
    case 'locate': return locate();
    case 'searchGo': var qi = document.getElementById('qIn'); if (qi) qi.blur(); return;
    case 'clearFilters': S.show = 'all'; S.cuisine = null; S.sort = 'new'; S.q = ''; save(); return render();
    case 'detail': return set({ detail: id });
    case 'closeDetail': return set({ detail: null });
    case 'toPassTab': return set({ detail: null, tab: 'pass' });
    case 'openPass': return openPass(id);
    case 'endVisit': return set({ visit: null });
    case 'tab': return set({ tab: id, detail: null, msg: null });
    case 'reloadDir': R.dirState = 'loading'; render(); return loadDirectory();
    case 'refreshStatus': return R.user && statusFromEntitlements(R.user.id).then(function (st) { set({ status: st }); });
    case 'copyRef':
      var it = inviteText(R.member), link = it.link;
      var done = function () { set({ msg: { kind: 'ok', text: 'Referral link copied.' } }); };
      if (navigator.share) return navigator.share({ title: it.subject, text: it.body }).catch(function () {});
      if (navigator.clipboard) return navigator.clipboard.writeText(link).then(done, function () { set({ msg: { kind: 'ok', text: link } }); });
      return set({ msg: { kind: 'ok', text: link } });
    case 'applyRef': return applyRef();
    case 'report': return set({ msg: { kind: 'ok', text: 'Thanks. A short report form opens at launch, and we follow up with the restaurant.' } });
    case 'partnerOpen': return set({ partnerOpen: true }, 'pName');
    case 'partnerClose': return set({ partnerOpen: false });
    case 'signOut': return signOut(false);
    case 'signOutAll': return signOut(true);
  }
});
document.addEventListener('submit', function (e) {
  if (e.target.id === 'partnerForm') { e.preventDefault(); submitPartner(); }
  else if (e.target.id === 'authForm') { e.preventDefault(); sendCode(false); }
});
var JD = { jdFirst: 'first_name', jdLast: 'last_name', jdPhone: 'phone', jdAddress1: 'address_line1', jdAddress2: 'address_line2', jdCity: 'city', jdState: 'state', jdZip: 'zip', jdRef: 'ref' };
document.addEventListener('input', function (e) {

  else if (JD[el.id]) { R.d = R.d || {}; R.d[JD[el.id]] = el.value; }

['pointerup', 'touchend', 'mouseup'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (e.target.id === 'swipe' && S.visit && !S.visit.confirmedAt) e.target.value = 0; }); });

// Live clock, countdown and resend timer.
setInterval(function () {
  var c = document.getElementById('clock'); if (c) c.textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  var cd = document.getElementById('countdown');
  if (cd && S.visit && !S.visit.confirmedAt) { var left = PASS_MS - (Date.now() - S.visit.openedAt); if (left <= 0) return render(); var s = Math.ceil(left / 1000); cd.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  var rb = document.getElementById('resendBtn');
  if (rb) { var w = Math.max(0, Math.ceil((R.sentAt + CFG.resendSeconds * 1000 - Date.now()) / 1000)); rb.disabled = w > 0 || R.busy; rb.textContent = w > 0 ? 'Resend in ' + w + 's' : 'Resend code'; }
}, 1000);

// ---------- Start ----------
(async function start() {
  render();
  var qs = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
  var refParam = qs.get('ref'); // referral link: remember it for sign-up on this device
  if (refOk(refParam)) { try { localStorage.setItem('gs-ref', refParam.trim().toUpperCase()); } catch (e) { /* storage off */ } }
  var linkErr = qs.get('error_description');
  loadDirectory(); loadPayOpen();
  if (!sb) { R.screen = 'welcome'; R.msg = { kind: 'err', text: 'LocalScout could not load. Check your connection and reload.' }; return render(); }
  var s = null;
  try { s = (await sb.auth.getSession()).data.session; } catch (e) { s = null; }
  if (location.search || /access_token|error/.test(location.hash)) history.replaceState(null, '', location.pathname);
  if (!s && linkErr) R.msg = { kind: 'err', text: 'That sign-in link didn’t work (' + linkErr.replace(/\+/g, ' ') + '). Links expire and work once. Request a new one.' };
  await onSession(s);
  sb.auth.onAuthStateChange(function (evt, session) {
    if (evt === 'SIGNED_IN' && (!R.user || R.user.id !== session.user.id)) onSession(session);
    else if (evt === 'SIGNED_OUT') onSession(null);
  });
})();
</script>
