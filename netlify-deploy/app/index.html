<style>
:root { --linen:#F6F4EF; --sand:#EDE8DE; --card:#FFFDF8; --bayou:#172A2A; --chili:#E2552B; --mustard:#F2B134; --brick:#B5401C; --ink2:#4A5857; --muted:#5C6968; --line:#E2DDD2; --mint:#BFD3CF; --ok:#2F6B4C; --okbg:#DDEFE3; --okfg:#1F4D35; --errbg:#FBE3DA; --errfg:#8A2E12; --display:'Bricolage Grotesque', 'Arial Black', Arial, sans-serif; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0f1d1d; }
body { font-family: 'DM Sans', 'Segoe UI', Arial, sans-serif; color: var(--bayou); -webkit-tap-highlight-color: transparent; }

.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 20px; padding: calc(16px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom)); overflow-y: auto; }
.dark { background: var(--bayou); color: var(--linen); }
.stack { display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-family: var(--display); font-size: 34px; line-height: 1.08; font-weight: 800; letter-spacing: -0.5px; }

a { color: var(--brick); }
.lede { color: var(--ink2); font-size: 17px; line-height: 1.4; }
.small { color: var(--muted); font-size: 14px; line-height: 1.4; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--brick); }
.btn { display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 999px; border: 2px solid var(--chili); background: var(--chili); color: var(--bayou); font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; width: 100%; text-decoration: none; padding: 0 20px; text-align: center; }
.btn.ghost { background: transparent; border-color: var(--bayou); color: var(--bayou); }
.btn.ghost-light { background: transparent; border-color: var(--mint); color: var(--linen); }
.btn.link { background: transparent; border-color: transparent; color: var(--brick); min-height: 44px; }
.btn:disabled { opacity: .5; cursor: default; }
.back { align-self: flex-start; width: 44px; height: 44px; border: 0; background: transparent; font-size: 28px; color: var(--bayou); cursor: pointer; padding: 0; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; }
.in { min-height: 54px; border: 1.5px solid #CFC7B8; border-radius: 14px; padding: 0 16px; font: inherit; font-size: 18px; color: var(--bayou); background: var(--card); width: 100%; }
textarea.in { padding: 12px 16px; min-height: 96px; resize: vertical; font-size: 16px; }
.in.search { border: 2px solid var(--bayou); border-radius: 999px; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 15px; color: var(--ink2); line-height: 1.4; min-height: 44px; }
.check input { width: 22px; height: 22px; flex-shrink: 0; accent-color: var(--chili); margin: 1px 0 0; }
:focus-visible { outline: 3px solid var(--chili); outline-offset: 2px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
.main { flex: 1; min-height: 0; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top)) 16px 24px; display: flex; flex-direction: column; gap: 12px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); color: var(--bayou); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.chip.on { background: var(--bayou); border-color: var(--bayou); color: var(--linen); }
.chip.soon { color: var(--muted); border-style: dashed; }
.row { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px; width: 100%; font: inherit; color: var(--bayou); cursor: pointer; }
.row .name { font-size: 19px; font-weight: 800; letter-spacing: -0.3px; }
.row .meta { font-size: 14px; color: var(--muted); }
.row .offer { font-size: 15px; font-weight: 700; }
.thumb { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; flex-shrink: 0; background: var(--sand); display: flex; align-items: center; justify-content: center; }
.hero { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 20px; background: var(--sand); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--sand); color: var(--ink2); }
.badge.new { background: var(--mustard); color: var(--bayou); }

.pill { flex-shrink: 0; min-height: 44px; border-radius: 999px; border: 0; background: var(--chili); color: var(--bayou); font: inherit; font-weight: 800; padding: 0 16px; cursor: pointer; }
.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: var(--card); border-top: 1px solid var(--line); padding: 6px 0 calc(8px + env(safe-area-inset-bottom)); }
.tab { border: 0; background: transparent; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: var(--muted); font: inherit; font-size: 12px; font-weight: 700; }
.tab[aria-current="page"] { color: var(--brick); }
.pass { background: var(--linen); border: 1px solid var(--line); border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.18); }
.pass.done { background: var(--okbg); box-shadow: none; border: 0; }
.pass .who { font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: -0.5px; overflow-wrap: anywhere; }
.clock { font-family: var(--display); font-size: 40px; font-weight: 800; text-align: center; background: var(--sand); border-radius: 16px; padding: 8px 0; font-variant-numeric: tabular-nums; }
.split { display: flex; justify-content: space-between; gap: 12px; border-top: 2px dashed #D9D2C4; padding-top: 14px; }
.split .k { font-size: 13px; color: var(--muted); } .split .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kv { display: flex; justify-content: space-between; gap: 12px; } .kv .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.track { position: relative; height: 64px; border-radius: 999px; background: var(--bayou); overflow: hidden; }
.track span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--linen); font-weight: 700; font-size: 16px; padding-left: 40px; pointer-events: none; }
.range { -webkit-appearance: none; appearance: none; width: 100%; height: 64px; margin: 0; background: transparent; position: relative; z-index: 1; touch-action: none; }
.range::-webkit-slider-runnable-track { height: 64px; background: transparent; }
.range::-webkit-slider-thumb { -webkit-appearance: none; width: 56px; height: 56px; margin-top: 4px; border-radius: 50%; background: var(--mustard); border: 0; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
.range::-moz-range-thumb { width: 56px; height: 56px; border-radius: 50%; background: var(--mustard); border: 0; }
.note { border-radius: 14px; padding: 12px 14px; font-size: 15px; line-height: 1.4; background: var(--sand); color: var(--ink2); }
.note.ok { background: var(--okbg); color: var(--okfg); }
.note.err { background: var(--errbg); color: var(--errfg); }
.sr { position: absolute; left: -9999px; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.center { flex: 1; display: flex; align-items: center; justify-content: center; }
</style>

<body>
<div id="phone">
  <div id="app" style="flex: 1; min-height: 0; display: flex; flex-direction: column;"></div>
</div>
<script>
'use strict';
// GrubScout phone app (installable web app). Same Supabase project, data and rules as the website.
// Only the project URL and publishable key belong here. Secrets stay in Supabase.
var CFG = {
  url: 'https://mroiimqqklitidpzaqnk.supabase.co',
  key: 'sb_publishable_1YSf5nmBBotBnOULa3g7vQ_nj0Fd1RH',
  site: '../',
  termsVersion: '2026-11-04',
  resendSeconds: 60,
  passMinutes: 15,
  version: '0.3.0'
};
var sb = null;
try {
  sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
} catch (e) { sb = null; }

var PASS_MS = CFG.passMinutes * 60000;
var KEY = 'gs-app';
var DAY = 86400000;

// UI state that survives a reload (no account data).
function fresh() { return { tab: 'explore', q: '', district: null, passQ: '', visit: null, mode: 'join', method: 'phone', phone: '', email: '', name: '' }; }
var S = (function () { try { var v = JSON.parse(localStorage.getItem(KEY)); return Object.assign(fresh(), v && typeof v === 'object' ? v : {}); } catch (e) { return fresh(); } })();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* private mode */ } }

// Runtime state.
var R = { screen: 'loading', detail: null, sentAt: 0, code: '', agree: false, marketing: false, busy: false, msg: null, user: null, member: null, status: { active: false }, isAdmin: false, payOpen: false,
  districts: [], list: [], dirState: 'loading', partner: null, partnerOpen: false };

function set(patch, keepFocus) { Object.keys(patch).forEach(function (k) { if (k in S) S[k] = patch[k]; else R[k] = patch[k]; }); save(); render(keepFocus); }

var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var emailOk = function (e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e || '').trim()); };
var safeUrl = function (u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; };
var fmtDate = function (d) { return new Date(d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); };
var LOGO = '<svg width="SIZE" height="SIZE" viewBox="240 148 840 840" role="img" aria-label="GrubScout"><path d="M552 795 A239 98 0 1 0 770 795 L751 821 A177 58 0 1 1 570 821 Z" fill="#E34C19"/><path d="M660 157 C515 157 398 275 398 420 C398 470 410 515 430 555 C480 660 590 800 653 881 Q660 888 667 881 C730 800 840 660 890 547 C910 505 920 470 920 420 C920 275 805 157 660 157 Z" fill="#E34C19"/><path d="M567 283 A21 21 0 0 1 609 283 V407 A16 16 0 0 0 641 407 V283 A21.5 21.5 0 0 1 684 283 V407 A16 16 0 0 0 716 407 V283 A21 21 0 0 1 758 283 L764 435 C764 478 735 506 702 507 C697 507 694 510 694 516 V550 L698 670 C698 692 682 708 662 708 C642 708 626 692 626 670 L630 550 V516 C630 510 627 507 622 507 C589 506 561 478 561 435 Z" fill="#FFFFFF"/></svg>';
var logo = function (n) { return LOGO.replace(/SIZE/g, String(n)); };
var ICON = {
  fork: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 2-2 6 0 8v10"/></svg>',
  card: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7h18v10H3zM3 11h18M7 15h4"/></svg>',
  user: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>'
};
var msgHtml = function () { return R.msg ? '<p class="note ' + (R.msg.kind || '') + '" role="' + (R.msg.kind === 'err' ? 'alert' : 'status') + '">' + esc(R.msg.text) + '</p>' : ''; };

// ---------- Data (same queries as the website) ----------
function restaurantFromRow(r) {
  var now = Date.now();
  return {
    id: String(r.id), name: r.name || 'Restaurant', desc: r.description || '', cuisine: r.cuisine || '', district: r.district_id || '',
    address: r.address || '', hours: r.hours || '', phone: r.phone || '', website: safeUrl(r.website_url),
    price: Math.max(1, Math.min(4, Number(r.price_level) || 2)), dineIn: r.dine_in !== false, pickup: !!r.pickup,
    offer: r.offer_text || 'Member offer coming soon', featured: !!r.featured, photo: safeUrl(r.photo_url),
    isNew: !!r.listed_at && now - new Date(r.listed_at).getTime() < 30 * DAY,
    founding: !!r.founding_until && new Date(r.founding_until).getTime() > now
  };
}
function districtName(id) { for (var i = 0; i < R.districts.length; i++) if (R.districts[i].id === id) return R.districts[i].name; return ''; }
function find(id) { for (var i = 0; i < R.list.length; i++) if (R.list[i].id === id) return R.list[i]; return null; }

async function loadDirectory() {
  if (!sb) { R.dirState = 'error'; return render(); }
  try {
    var d = await sb.from('districts').select('id, name, lat, lng, live').order('sort_order');
    var r = await sb.from('restaurants').select('id, name, description, cuisine, district_id, address, hours, phone, website_url, lat, lng, price_level, dine_in, pickup, offer_text, founding_until, listed_at, featured, photo_url').eq('status', 'active').order('name');
    if (d.error || r.error) throw d.error || r.error;
    R.districts = d.data || [];
    R.list = (r.data || []).map(restaurantFromRow).sort(function (a, b) { return (b.featured - a.featured) || a.name.localeCompare(b.name); });
    R.dirState = 'ready';
  } catch (e) { R.dirState = 'error'; }
  render();
}
async function loadPayOpen() {
  if (!sb) return;
  try { var o = await sb.from('offerings').select('id, active').eq('id', 'membership_annual').maybeSingle(); R.payOpen = !!(o.data && o.data.active); } catch (e) { R.payOpen = false; }
}
function memberFromUser(u) {
  var m = u.user_metadata || {};
  var name = String(m.full_name || m.name || (u.email || '').split('@')[0] || 'Member').trim();
  var ph = String(u.phone || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
  return { id: u.id, name: name, email: u.email || '', phone: ph ? fmtPhone(ph) : '', ref: 'GS-' + String(u.id).replace(/-/g, '').slice(0, 6).toUpperCase(), since: u.created_at };
}
async function statusFromEntitlements(uid) {
  try {
    var q = await sb.from('entitlements').select('source, access_expires_at, grace_expires_at').eq('user_id', uid).eq('feature', 'membership');
    if (q.error) throw q.error;
    var now = Date.now(), best = null;
    (q.data || []).forEach(function (e) {
      var until = e.source === 'admin' ? now + 365 * DAY : Math.max(new Date(e.access_expires_at).getTime() || 0, new Date(e.grace_expires_at || 0).getTime() || 0);
      if (until > now && (!best || until > best.until)) best = { active: true, until: until, source: e.source, grace: new Date(e.access_expires_at).getTime() <= now };
    });
    return best || { active: false };
  } catch (e) { return { active: false, error: true }; }
}
async function checkAdmin(uid) {
  try { var a = await sb.from('platform_admins').select('user_id').eq('user_id', uid).maybeSingle(); return !!(a.data); } catch (e) { return false; }
}
async function onSession(session) {
  if (!session || !session.user) { R.user = null; R.member = null; R.status = { active: false }; R.isAdmin = false; if (R.screen === 'loading' || R.screen === 'app') R.screen = 'welcome'; return render(); }
  R.user = session.user; R.member = memberFromUser(session.user);
  R.screen = 'app'; R.msg = null; render();
  var st = await statusFromEntitlements(session.user.id);
  var adm = await checkAdmin(session.user.id);
  R.status = st; R.isAdmin = adm;
  if (!st.active && S.visit) S.visit = null;
  save(); render();
}

// ---------- Auth: phone + text code, or email + code (the email also carries a sign-in link) ----------
var fmtPhone = function (d) { return d.length < 4 ? d : d.length < 7 ? '(' + d.slice(0, 3) + ') ' + d.slice(3) : '(' + d.slice(0, 3) + ') ' + d.slice(3, 6) + '-' + d.slice(6); };
var phoneOk = function () { return S.phone.length === 10 && /^[2-9]/.test(S.phone); };
var e164 = function () { return '+1' + S.phone; };
function loginOk() {
  var id = S.method === 'phone' ? phoneOk() : emailOk(S.email);
  return id && (S.mode !== 'join' || (S.name.trim() && R.agree));
}
function authErrText(err) { return (String(err.message || '') + ' ' + String(err.code || '') + ' ' + String(err.status || '')).toLowerCase(); }
async function sendCode(isResend) {
  if (!sb) return set({ msg: { kind: 'err', text: 'GrubScout could not load. Check your connection and reload.' } });
  var phone = S.method === 'phone';
  var opts = { shouldCreateUser: S.mode === 'join' };
  if (S.mode === 'join') opts.data = { full_name: S.name.trim(), terms_version: CFG.termsVersion, terms_accepted_at: new Date().toISOString(), marketing_opt_in: !!R.marketing };
  if (!phone) opts.emailRedirectTo = location.origin + location.pathname;
  var args = phone ? { phone: e164(), options: opts } : { email: S.email.trim().toLowerCase(), options: opts };
  set({ busy: true, msg: null });
  var res; try { res = await sb.auth.signInWithOtp(args); } catch (e) { res = { error: { message: 'network' } }; }
  var err = res && res.error, t = err ? authErrText(err) : '';
  if (err && S.mode === 'signin' && /otp_disabled|signups? not allowed|user not found/.test(t)) err = null; // don't reveal whether an account exists
  if (err) {
    var m;
    if (phone && /provider|phone.*(disabled|not enabled)|unsupported|sms/.test(t)) m = 'Text sign-in isn’t switched on yet. Use email for now.';
    else if (/rate|too many|429|seconds/.test(t)) m = 'Too many tries. Wait a minute, then try again.';
    else if (phone && /invalid.*phone|phone.*invalid/.test(t)) m = 'Check the mobile number. We can only text US numbers right now.';
    else m = phone ? 'We couldn’t text a code just now. Check the number, or use email.' : 'We couldn’t send the email just now. Check the address and your connection, then try again.';
    return set({ busy: false, msg: { kind: 'err', text: m, toEmail: phone } });
  }
  set({ busy: false, screen: 'code', code: '', sentAt: Date.now(), msg: isResend ? { kind: 'ok', text: phone ? 'New code sent.' : 'Sent again. Check your inbox and spam folder.' } : null }, 'codeIn');
}
async function verifyCode() {
  if (R.busy || R.code.length < 6) return;
  var phone = S.method === 'phone';
  var args = phone ? { phone: e164(), token: R.code, type: 'sms' } : { email: S.email.trim().toLowerCase(), token: R.code, type: 'email' };
  set({ busy: true, msg: null });
  var res; try { res = await sb.auth.verifyOtp(args); } catch (e) { res = { error: { message: 'network' } }; }
  if (res.error || !res.data || !res.data.session) {
    var t = res.error ? authErrText(res.error) : '';
    var m = /expired|invalid|token/.test(t) ? 'That code didn’t work. It may have expired. Check it or send a new one.' : /rate|too many|429/.test(t) ? 'Too many tries. Wait a minute, then try again.' : 'We couldn’t check the code. Check your connection and try again.';
    return set({ busy: false, code: '', msg: { kind: 'err', text: m } }, 'codeIn');
  }
  R.busy = false; R.code = '';
  await onSession(res.data.session);
}
async function signOut(all) {
  set({ busy: true });
  try { await sb.auth.signOut({ scope: all ? 'global' : 'local' }); } catch (e) { /* still clear locally */ }
  S.visit = null; save();
  set({ busy: false, screen: 'welcome', user: null, member: null, status: { active: false }, isAdmin: false, msg: { kind: 'ok', text: all ? 'Signed out on all devices.' : 'Signed out.' } });
}

// ---------- Screens ----------
function vLoading() { return '<div class="screen dark"><div class="center">' + logo(72) + '</div></div>'; }
function vWelcome() {
  return '<div class="screen dark"><div class="stack" style="gap:18px; margin-top:32px">' + logo(72) +
    '<p style="font-family:var(--display);font-size:28px;font-weight:800;letter-spacing:-.5px">Grub<span style="color:var(--chili)">Scout</span></p>' +
    '<h1 style="font-size:40px;color:var(--linen)">One $30 pass. <span style="color:var(--mustard)">Every great local table in Houston.</span></h1>' +
    '<p style="color:var(--mint);font-size:19px;line-height:1.4">Show your pass, save on the check. Pays for itself in about five dinners.</p>' + msgHtml() + '</div>' +
    '<div class="stack" style="gap:12px"><button class="btn" data-act="join">Get started</button><button class="btn ghost-light" data-act="signin">I already have an account</button>' +
    '<button class="btn link" style="color:var(--mustard)" data-act="browse">Browse restaurants first</button>' +
    '<p style="color:var(--mint);font-size:14px;text-align:center">Restaurants join free. Members pay $30 a year.</p></div></div>';
}

function tabsHtml() {
  return '<nav class="tabs" aria-label="Main">' + [['explore', 'Explore', ICON.fork], ['pass', 'My pass', ICON.card], ['account', 'Account', ICON.user]].map(function (t) {
    return '<button class="tab" data-act="tab" data-id="' + t[0] + '"' + (S.tab === t[0] && !R.detail ? ' aria-current="page"' : '') + '>' + t[2] + '<span>' + t[1] + '</span></button>';
  }).join('') + '</nav>';
}
function vPass() {
  if (!R.member) return vPassSignedOut();
  if (!R.status.active) return vPassUnpaid();
  return S.visit ? vVisit() : vPassPicker();
}
function render(keepFocusId) {
  var html;
  if (R.screen === 'loading') html = vLoading();
  else if (R.screen === 'welcome') html = vWelcome();
  else if (R.screen === 'login') html = vLogin();
  else if (R.screen === 'code') html = vCode();
  else html = (R.detail ? vDetail() : S.tab === 'explore' ? vExplore() : S.tab === 'account' ? (R.member ? vAccount() : vAccountSignedOut()) : vPass()) + tabsHtml();
  document.getElementById('app').innerHTML = html;
  if (keepFocusId) { var el = document.getElementById(keepFocusId); if (el) { el.focus(); var n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) { /* not a text field */ } } }
}

// ---------- Visits ----------
function openPass(id) {
  if (!R.member || !R.status.active) return set({ tab: 'pass', detail: null });
  var r = find(id);
  set({ tab: 'pass', detail: null, visit: { rid: id, name: r ? r.name : '', offer: r ? r.offer : '', openedAt: Date.now(), confirmedAt: null, code: null } });
}
async function confirmVisit() {
  if (!S.visit || S.visit.confirmedAt) return;
  var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', c = '', b = crypto.getRandomValues(new Uint8Array(6));
  for (var i = 0; i < 6; i++) c += a[b[i] % a.length];
  if (navigator.vibrate) navigator.vibrate(60);
  var v = Object.assign({}, S.visit, { confirmedAt: Date.now(), code: c });
  set({ visit: v });
  try {
    var res = await sb.from('redemptions').insert({ restaurant_id: v.rid, restaurant_name: v.name || null, offer: v.offer || null, code: v.code, opened_at: new Date(v.openedAt).toISOString(), confirmed_at: new Date(v.confirmedAt).toISOString() });
    if (res.error) console.warn('GrubScout: visit not recorded', res.error.message);
  } catch (e) { console.warn('GrubScout: visit not recorded'); }
}

// ---------- Partner application (same RPC as the website) ----------
async function submitPartner() {
  var p = R.partner = R.partner || {};
  document.querySelectorAll('.pf').forEach(function (el) { p[el.id] = el.value; });
  var t = function (k) { return String(p[k] || '').trim(); };
  var req = ['pName', 'pFirst', 'pLast', 'pPhone', 'pEmail', 'pAddress1', 'pCity', 'pState', 'pZip', 'pCuisine', 'pDesc'];
  var missing = req.filter(function (k) { return !t(k); });
  if (missing.length) { p.err = 'Please fill in every field marked *.'; render(); var el = document.getElementById(missing[0]); if (el) el.focus(); return; }
  if (!emailOk(t('pEmail'))) { p.err = 'Check the email address.'; render(); document.getElementById('pEmail').focus(); return; }
  if (t('pPhone').replace(/\D/g, '').length < 10) { p.err = 'Check the phone number.'; render(); document.getElementById('pPhone').focus(); return; }
  p.err = null; p.busy = true; render();
  var address = [t('pAddress1'), t('pAddress2'), t('pCity') + ', ' + t('pState').toUpperCase() + ' ' + t('pZip')].filter(Boolean).join(', ');
  var res;
  try {
    res = await sb.rpc('submit_partner_application', {
      p_restaurant_name: t('pName'), p_contact_name: t('pFirst') + ' ' + t('pLast'), p_contact_reach: 'Phone: ' + t('pPhone') + ' | Email: ' + t('pEmail'),
      p_description: t('pDesc'), p_address: address, p_district: t('pCity'), p_cuisine: t('pCuisine'), p_proposed_offer: t('pOffer') || null, p_hp: t('pHp')
    });
  } catch (e) { res = { error: { message: 'network' } }; }
  p.busy = false;
  if (res.error) { p.err = /rate_limited/i.test(String(res.error.message || '')) ? 'We’ve received several applications from you recently. Please try again later.' : 'We couldn’t send your application. Check your connection and try again.'; return render(); }
  R.partner = { done: true }; render();
}

// ---------- Events ----------
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  var id = t.getAttribute('data-id');
  switch (t.getAttribute('data-act')) {
    case 'join': return set({ screen: 'login', mode: 'join', detail: null, msg: null }, S.name ? idField() : 'nameIn');
    case 'signin': return set({ screen: 'login', mode: 'signin', detail: null, msg: null }, idField());
    case 'method': S.method = id; return set({ screen: 'login', code: '', msg: null }, idField());
    case 'browse': return set({ screen: 'app', tab: 'explore', msg: null });
    case 'toWelcome': return set({ screen: R.user ? 'app' : 'welcome', msg: null });
    case 'toLogin': return set({ screen: 'login', code: '', msg: null }, idField());
    case 'send': return sendCode(false);
    case 'resend': return sendCode(true);
    case 'verify': return verifyCode();
    case 'district': return set({ district: id || null });
    case 'detail': return set({ detail: id });
    case 'closeDetail': return set({ detail: null });
    case 'toPassTab': return set({ detail: null, tab: 'pass' });
    case 'openPass': return openPass(id);
    case 'endVisit': return set({ visit: null });
    case 'tab': return set({ tab: id, detail: null, msg: null });
    case 'reloadDir': R.dirState = 'loading'; render(); return loadDirectory();
    case 'refreshStatus': return R.user && statusFromEntitlements(R.user.id).then(function (st) { set({ status: st }); });
    case 'copyRef':
      var link = new URL(CFG.site, location.href).href + '?ref=' + encodeURIComponent(R.member.ref);
      var done = function () { set({ msg: { kind: 'ok', text: 'Referral link copied.' } }); };
      if (navigator.share) return navigator.share({ title: 'GrubScout', text: 'Join me on GrubScout: one $30 pass for great local Houston restaurants.', url: link }).catch(function () {});
      if (navigator.clipboard) return navigator.clipboard.writeText(link).then(done, function () { set({ msg: { kind: 'ok', text: link } }); });
      return set({ msg: { kind: 'ok', text: link } });
    case 'report': return set({ msg: { kind: 'ok', text: 'Thanks. A short report form opens at launch, and we follow up with the restaurant.' } });
    case 'partnerOpen': return set({ partnerOpen: true }, 'pName');
    case 'partnerClose': return set({ partnerOpen: false });
    case 'signOut': return signOut(false);
    case 'signOutAll': return signOut(true);
  }
});
document.addEventListener('submit', function (e) { if (e.target.id === 'partnerForm') { e.preventDefault(); submitPartner(); } });
function idField() { return S.method === 'phone' ? 'phoneIn' : 'emailIn'; }
function syncSend() { var b = document.getElementById('sendBtn'); if (b) b.disabled = R.busy || !loginOk(); }
document.addEventListener('input', function (e) {
  var el = e.target;
  if (el.id === 'emailIn') { S.email = el.value; save(); syncSend(); }
  else if (el.id === 'phoneIn') { S.phone = el.value.replace(/\D/g, '').replace(/^1(?=\d{10})/, '').slice(0, 10); save(); el.value = fmtPhone(S.phone); syncSend(); }
  else if (el.id === 'codeIn') { R.code = el.value.replace(/\D/g, '').slice(0, 8); el.value = R.code; var vb = document.getElementById('verifyBtn'); if (vb) vb.disabled = R.busy || R.code.length < 6; if (R.code.length === 6 && e.inputType !== 'insertText') verifyCode(); }
  else if (el.id === 'nameIn') { S.name = el.value; save(); syncSend(); }
  else if (el.id === 'qIn') { S.q = el.value; save(); document.getElementById('exploreList').innerHTML = listHtml(); }
  else if (el.id === 'passQIn') { S.passQ = el.value; save(); document.getElementById('passList').innerHTML = passItems().map(passRow).join(''); }
  else if (el.id === 'swipe') { if (Number(el.value) >= 92) confirmVisit(); }
  else if (el.classList.contains('pf')) { R.partner = R.partner || {}; R.partner[el.id] = el.value; }
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'agreeIn') { R.agree = e.target.checked; syncSend(); }
  else if (e.target.id === 'mktIn') { R.marketing = e.target.checked; }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && (e.target.id === 'emailIn' || e.target.id === 'nameIn' || e.target.id === 'phoneIn')) { var b = document.getElementById('sendBtn'); if (b && !b.disabled) sendCode(false); }
  if (e.key === 'Enter' && e.target.id === 'codeIn') verifyCode();
  if (e.target.id === 'swipe' && e.key === 'Enter') confirmVisit();
});
['pointerup', 'touchend', 'mouseup'].forEach(function (ev) { document.addEventListener(ev, function (e) { if (e.target.id === 'swipe' && S.visit && !S.visit.confirmedAt) e.target.value = 0; }); });

// Live clock, countdown and resend timer.
setInterval(function () {
  var c = document.getElementById('clock'); if (c) c.textContent = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  var cd = document.getElementById('countdown');
  if (cd && S.visit && !S.visit.confirmedAt) { var left = PASS_MS - (Date.now() - S.visit.openedAt); if (left <= 0) return render(); var s = Math.ceil(left / 1000); cd.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  var rb = document.getElementById('resendBtn');
  if (rb) { var w = Math.max(0, Math.ceil((R.sentAt + CFG.resendSeconds * 1000 - Date.now()) / 1000)); rb.disabled = w > 0 || R.busy; rb.textContent = w > 0 ? 'Resend in ' + w + 's' : 'Resend code'; }
}, 1000);

// ---------- Start ----------
(async function start() {
  render();
  var qs = new URLSearchParams(location.search + '&' + location.hash.replace(/^#/, ''));
  var linkErr = qs.get('error_description');
  loadDirectory(); loadPayOpen();
  if (!sb) { R.screen = 'welcome'; R.msg = { kind: 'err', text: 'GrubScout could not load. Check your connection and reload.' }; return render(); }
  var s = null;
  try { s = (await sb.auth.getSession()).data.session; } catch (e) { s = null; }
  if (location.search || /access_token|error/.test(location.hash)) history.replaceState(null, '', location.pathname);
  if (!s && linkErr) R.msg = { kind: 'err', text: 'That sign-in link didn’t work (' + linkErr.replace(/\+/g, ' ') + '). Links expire and work once. Request a new one.' };
  await onSession(s);
  sb.auth.onAuthStateChange(function (evt, session) {
    if (evt === 'SIGNED_IN' && (!R.user || R.user.id !== session.user.id)) onSession(session);
    else if (evt === 'SIGNED_OUT') onSession(null);
  });
})();
</script>
